<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SL Tourism</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Navigation Bar -->
    <header class="sticky top-0 bg-white shadow-md z-50">
        <nav class="container mx-auto flex items-center justify-between p-4">
            <a href="index.html" class="text-2xl font-bold text-blue-600">SL Tourism</a>
            <ul class="hidden md:flex space-x-6">
                <li><a href="index.html" class="hover:text-blue-600">Home</a></li>
                <li><a href="about.html" class="hover:text-blue-600">About Us</a></li>
                <li><a href="services.html" class="hover:text-blue-600">Services</a></li>
                <li><a href="contact.html" class="hover:text-blue-600">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Enhanced Contact Section -->
    <section class="py-16 bg-gradient-to-r from-blue-50 to-blue-100">
        <div class="container mx-auto text-center">
            <h2 class="text-4xl font-extrabold text-blue-700 mb-8">Contact Us</h2>
            <p class="text-lg text-gray-700 mb-6">We'd love to hear from you! Reach out to us for any inquiries or assistance.</p>
            <form class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-8">
                <div class="mb-6">
                    <label for="name" class="block text-left text-gray-700 font-semibold mb-2">Name</label>
                    <input type="text" id="name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Your Name">
                </div>
                <div class="mb-6">
                    <label for="email" class="block text-left text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Your Email">
                </div>
                <div class="mb-6">
                    <label for="message" class="block text-left text-gray-700 font-semibold mb-2">Message</label>
                    <textarea id="message" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" rows="4" placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Enhanced Map Section -->
    <section class="py-16 bg-[#f8fafc] rounded-lg">
        <div class="container mx-auto text-center">
            <h2 class="text-4xl font-extrabold text-blue-700 mb-8">Find Us on the Map</h2>
            <p class="text-lg text-gray-700 mb-6">Locate us in the heart of Sri Lanka. Here's where you can find us!</p>
            <div class="relative overflow-hidden rounded-lg shadow-lg mx-auto" style="width: 8cm; height: 8cm;">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126743.4217687076!2d79.790345!3d6.927079!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae2591b8b8b8b8b%3A0x8b8b8b8b8b8b8b8b!2sColombo%2C%20Sri%20Lanka!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus" 
                    class="absolute top-0 left-0 w-full h-full border-0" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </section>
    

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 SL Tourism. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
