<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SL Tourism</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Navigation Bar -->
    <header class="sticky top-0 bg-white shadow-md z-50">
        <nav class="container mx-auto flex items-center justify-between p-4">
            <a href="index.html" class="text-2xl font-bold text-blue-600">SL Tourism</a>
            <ul class="hidden md:flex space-x-6">
                <li><a href="index.html" class="hover:text-blue-600">Home</a></li>
                <li><a href="about.html" class="hover:text-blue-600">About Us</a></li>
                <li><a href="services.html" class="hover:text-blue-600">Services</a></li>
                <li><a href="contact.html" class="hover:text-blue-600">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="py-12 bg-gray-100">
        <div class="container mx-auto text-center">
            <h2 class="text-3xl font-bold mb-6">Contact Us</h2>
            <p class="text-gray-600 mb-4">We'd love to hear from you! Reach out to us for any inquiries or assistance.</p>
            <form class="max-w-lg mx-auto">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-bold mb-2">Name</label>
                    <input type="text" id="name" class="w-full px-4 py-2 border rounded-lg" placeholder="Your Name">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg" placeholder="Your Email">
                </div>
                <div class="mb-4">
                    <label for="message" class="block text-gray-700 font-bold mb-2">Message</label>
                    <textarea id="message" class="w-full px-4 py-2 border rounded-lg" rows="4" placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 SL Tourism. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
